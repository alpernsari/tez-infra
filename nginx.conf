events { worker_connections 100000; }

http {
    upstream order-backend {
        server order-service:8082; 
    }

    server {
        listen 80;
        
        location / {
            proxy_pass http://order-backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}