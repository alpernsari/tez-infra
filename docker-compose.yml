version: '3.8'
services:
  monolith-db:
    image: postgres:16-alpine
    container_name: monolith-db
    environment:
      POSTGRES_USER: tez_user
      POSTGRES_PASSWORD: tez_password
      POSTGRES_DB: monolith_db
    ports:
      - "5432:5432"
    volumes:
      - monolith_db_data:/var/lib/postgresql/data
    networks:
      - tez-network
  stock-db:
    image: postgres:16-alpine
    container_name: stock-db
    environment:
      POSTGRES_USER: tez_user
      POSTGRES_PASSWORD: tez_password
      POSTGRES_DB: stock_db
    ports:
      - "5434:5432" 
    volumes:
      - stock_db_data:/var/lib/postgresql/data
    networks:
      - tez-network
  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: tez_user
      POSTGRES_PASSWORD: tez_password
      POSTGRES_DB: order_db
    ports:
      - "5433:5432" 
    volumes:
      - order_db_data:/var/lib/postgresql/data
    networks:
      - tez-network
  monolith-app:
    build:
      context: ../monolith-app
      dockerfile: Dockerfile
    container_name: monolith-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://monolith-db:5432/monolith_db
    depends_on:
      - monolith-db
    networks:
      - tez-network
  stock-service:
    build:
      context: ../stock-app
      dockerfile: Dockerfile
    container_name: stock-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stock-db:5432/stock_db
    depends_on:
      - stock-db
    networks:
      - tez-network
  order-service:
    build:
      context: ../order-app
      dockerfile: Dockerfile
      #container_name: order-service
      #ports:
       # - "8082:8082"
    deploy:
      replicas: 3
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/order_db
      - STOCK_SERVICE_URL=http://stock-service:8081/api/products
    depends_on:
      - order-db
      - stock-service
    networks:
      - tez-network
  api-gateway:
    image: nginx:latest
    container_name: api-gateway
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - order-service
    networks:
      - tez-network
volumes:
  monolith_db_data:
  stock_db_data:
  order_db_data:
networks:
  tez-network:
    driver: bridge
